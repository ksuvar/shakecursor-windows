name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: ShakeCursor
          path: bin/ShakeCursor.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "$env:GITHUB_REF_NAME" --generate-notes }
          gh release upload "$env:GITHUB_REF_NAME" bin/ShakeCursor.exe --clobber
